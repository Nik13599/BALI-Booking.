<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050607">
<title>BALI Booking</title>
<style>
:root{--bg:#050607;--card:#0d1012;--line:#252b2f;--text:#f7f9fa;--muted:#89939a;--lime:#baff63;--purple:#a978ff;--red:#ff6975}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 80px}.brand{font-weight:950;letter-spacing:.13em;color:var(--lime);font-size:12px}.hero{margin-top:10px;border:1px solid var(--line);background:linear-gradient(145deg,#101416,#090b0c);border-radius:18px;padding:18px}.hero h1{margin:5px 0 7px;font-size:27px;letter-spacing:-.04em}.muted{color:var(--muted);font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 9px}.list{display:grid;gap:8px}.event{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:13px;display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center}.time{width:54px;height:54px;border-radius:13px;background:#171421;color:#cbb7ff;display:grid;place-items:center;font-weight:950}.event b{font-size:14px}.meta{font-size:10px;color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line);background:#141719;color:#fff;border-radius:10px;padding:9px 11px;font-weight:850}.btn.g{background:var(--lime);border-color:var(--lime);color:#101608}.details{margin-top:9px;border-top:1px solid var(--line);padding-top:10px;display:none;grid-column:1/-1}.details.on{display:block}.tables{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.table{min-width:42px;height:42px;border-radius:10px;border:1px solid #2b5035;background:#11291a;color:#aaffbf;font-weight:900}.table.occ{border-color:#5b3036;background:#2d161a;color:#ff9aa4}.err{border:1px solid #5b3036;background:#2d161a;color:#ffadb4;border-radius:14px;padding:15px}.loading{text-align:center;padding:40px;color:var(--muted)}@media(max-width:560px){.event{grid-template-columns:52px 1fr}.event>.btn{grid-column:2}.time{width:48px;height:48px}.hero h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">BALI BOOKING</div>
  <div class="hero"><div class="muted">MINСК · БРОНИРОВАНИЕ СТОЛОВ</div><h1>Выберите мероприятие</h1><div class="muted">Свободные столы загружаются напрямую из PostgreSQL.</div></div>
  <div class="section"><b>Ближайшие мероприятия</b><button class="btn" id="reload">Обновить</button></div>
  <div id="app" class="loading">Загрузка…</div>
</div>
<script>
const API='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-booking-api';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD=x=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(x));
const fmtT=x=>new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',hour:'2-digit',minute:'2-digit'}).format(new Date(x));
async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,payload})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j.data||j}
function render(d){const events=(d.events||[]).filter(e=>new Date(e.ends_at)>new Date());const occupied=d.occupied||[];const et=d.eventTables||[];if(!events.length){$('#app').className='';$('#app').innerHTML='<div class="event"><div class="muted">Ближайших мероприятий пока нет.</div></div>';return}$('#app').className='list';$('#app').innerHTML=events.map(e=>{const tables=et.filter(t=>t.event_id===e.id&&t.active!==false).sort((a,b)=>a.table_no-b.table_no);const occ=new Set(occupied.filter(t=>t.event_id===e.id).map(t=>+t.table_no));return `<div class="event"><div class="time">${fmtT(e.starts_at)}</div><div><b>${esc(e.name)}</b><div class="meta">${fmtD(e.starts_at)} · ${fmtT(e.starts_at)}–${fmtT(e.ends_at)}${e.comment?' · '+esc(e.comment):''}</div></div><button class="btn g" data-open="${esc(e.id)}">Столы</button><div class="details" id="d_${esc(e.id)}"><div class="muted">${tables.length?'Зелёный — свободен, красный — занят':'Для этого мероприятия схема столов не используется.'}</div><div class="tables">${tables.map(t=>`<button class="table ${occ.has(+t.table_no)?'occ':''}" ${occ.has(+t.table_no)?'disabled':''}>${t.table_no}</button>`).join('')}</div></div></div>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>document.getElementById('d_'+b.dataset.open).classList.toggle('on'))}
async function load(){const app=$('#app');app.className='loading';app.textContent='Загрузка…';try{render(await api('public.bootstrap'))}catch(e){app.className='err';app.textContent='Ошибка подключения: '+e.message}}
$('#reload').onclick=load;load();
</script>
</body></html>
