name: Build BALI Booking
on:
  workflow_dispatch:
  push:
    branches: [ main, rebuild/admin-v2 ]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: BALI-Booking-Android, path: android/app/build/outputs/apk/debug/app-debug.apk }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet publish windows/BaliBooking/BaliBooking.csproj -c Release -r win-x64 --self-contained false -o out/windows
      - uses: actions/upload-artifact@v4
        with: { name: BALI-Booking-Windows, path: out/windows }
