name: Build Android
on: [workflow_dispatch, push]
jobs:
 build:
  if: contains(github.event.head_commit.message || '', '[build]') || github.event_name == 'workflow_dispatch'
  runs-on: ubuntu-latest
  defaults: { run: { working-directory: android } }
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.10.2' }
   - run: gradle assembleDebug
   - uses: actions/upload-artifact@v4
     with: { name: BALI-Booking-Android, path: android/app/build/outputs/apk/debug/app-debug.apk }
