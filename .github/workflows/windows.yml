name: Build Windows
on: [workflow_dispatch, push]
jobs:
 build:
  if: contains(github.event.head_commit.message || '', '[build]') || github.event_name == 'workflow_dispatch'
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-dotnet@v4
     with: { dotnet-version: '8.0.x' }
   - run: dotnet publish windows/BaliBooking.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o dist/windows
   - uses: actions/upload-artifact@v4
     with: { name: BALI-Booking-Windows, path: dist/windows/** }
