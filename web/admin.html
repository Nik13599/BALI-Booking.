<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050607"><title>BALI Booking Admin</title><style>
:root{--bg:#050607;--card:#0d1012;--line:#252b2f;--text:#f7f9fa;--muted:#89939a;--lime:#baff63;--purple:#a978ff;--red:#ff6975}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{display:grid;grid-template-columns:190px 1fr;min-height:100vh}.side{padding:18px 10px;border-right:1px solid var(--line)}.brand{font-weight:950;letter-spacing:.12em;color:var(--lime);font-size:12px;padding:8px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{border:0;background:transparent;color:#89939a;text-align:left;padding:11px;border-radius:10px;font-weight:850}.nav button.on{background:#151b15;color:var(--lime)}main{padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.eye{font-size:9px;color:var(--lime);font-weight:900;letter-spacing:.14em}.top h1{margin:5px 0 2px;font-size:27px}.muted,.meta{color:var(--muted);font-size:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.card,.row{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px}.stat small{font-size:8px;color:var(--muted);text-transform:uppercase}.stat b{display:block;font-size:25px;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center}.badge{width:46px;height:46px;border-radius:12px;background:#172119;color:var(--lime);display:grid;place-items:center;font-weight:950}.btn{border:1px solid var(--line);background:#141719;color:#fff;border-radius:10px;padding:9px 11px;font-weight:850}.btn.g{background:var(--lime);border-color:var(--lime);color:#101608}.err{border:1px solid #5b3036;background:#2d161a;color:#ffadb4;border-radius:14px;padding:15px}.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:12px}.box{width:min(580px,100%);max-height:92vh;overflow:auto;background:#0b0e10;border:1px solid var(--line);border-radius:18px;padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid label{font-size:9px;color:#9aa3a8}.grid input,.grid select,.grid textarea{width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#07090a;color:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}@media(max-width:800px){.shell{display:block}.side{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#090b0cf2;border:0;border-top:1px solid var(--line);padding:5px}.brand{display:none}.nav{grid-template-columns:repeat(4,1fr);margin:0}.nav button{text-align:center;font-size:9px;padding:9px 2px}main{padding:14px 11px 78px}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:46px 1fr}.row>div:last-child{grid-column:2}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="app"><div style="padding:30px;color:#89939a">Загрузка BALI Booking…</div></div><div id="modal"></div><script>
const API='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-booking-api',S={data:null,view:'today'};const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){return new URLSearchParams((location.hash||'').replace(/^#/,'')).get('key')||''}async function api(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-bali-admin-token':key()},body:JSON.stringify({action,payload})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||('HTTP '+r.status));return j.data||j}const fd=x=>x?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(x)):'',ft=x=>x?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Minsk',hour:'2-digit',minute:'2-digit'}).format(new Date(x)):'';
function shell(c){app.innerHTML='<div class="shell"><aside class="side"><div class="brand">BALI BOOKING<div class="muted">POSTGRES / ADMIN</div></div><div class="nav">'+[['today','Сегодня'],['events','События'],['bookings','Брони'],['clients','Клиенты']].map(x=>'<button data-v="'+x[0]+'" class="'+(S.view===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div></aside><main>'+c+'</main></div>';document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()})}function top(t,s,a=''){return'<div class="top"><div><div class="eye">BALI BOOKING</div><h1>'+esc(t)+'</h1><div class="muted">'+esc(s||'')+'</div></div><div>'+a+'</div></div>'}
function today(){const now=new Date(),es=(S.data.events||[]).filter(e=>new Date(e.ends_at)>now).slice(0,10),bs=(S.data.bookings||[]).filter(b=>b.status!=='cancelled');shell(top('Сегодня / смена','Данные из PostgreSQL','<button class="btn g" id="add">+ Бронь</button>')+'<div class="stats"><div class="card stat"><small>События</small><b>'+es.length+'</b></div><div class="card stat"><small>Брони</small><b>'+bs.length+'</b></div><div class="card stat"><small>Гости</small><b>'+bs.reduce((a,b)=>a+(+b.guests||0),0)+'</b></div><div class="card stat"><small>Пришли</small><b>'+bs.filter(b=>b.checked_in_at).length+'</b></div></div><div class="section"><b>Ближайшие мероприятия</b></div><div class="list">'+es.map(e=>'<div class="row"><div class="badge">'+ft(e.starts_at)+'</div><div><b>'+esc(e.name)+'</b><div class="meta">'+fd(e.starts_at)+' · '+ft(e.starts_at)+'–'+ft(e.ends_at)+'</div></div></div>').join('')+'</div>');$('#add').onclick=bookingForm}
function events(){const es=S.data.events||[];shell(top('События',es.length+' записей')+'<div class="list">'+es.map(e=>'<div class="row"><div class="badge">'+ft(e.starts_at)+'</div><div><b>'+esc(e.name)+'</b><div class="meta">'+fd(e.starts_at)+' · '+esc(e.type)+' · '+(e.use_tables?'со столами':'без столов')+'</div></div></div>').join('')+'</div>')}
function bookings(){const bs=(S.data.bookings||[]).filter(b=>b.status!=='cancelled');shell(top('Брони',bs.length+' активных','<button class="btn g" id="add">+ Бронь</button>')+'<div class="list">'+bs.map(b=>'<div class="row"><div class="badge">'+((S.data.bookingTables||[]).filter(t=>t.booking_id===b.id&&!t.released_at).map(t=>t.table_no).join(',')||'—')+'</div><div><b>'+esc(b.name)+'</b><div class="meta">'+fd(b.arrival_at)+' '+ft(b.arrival_at)+' · '+b.guests+' гост. · '+esc(b.phone)+'</div></div><div><a class="btn" href="tel:'+esc(b.phone)+'">☎</a></div></div>').join('')+'</div>');$('#add').onclick=bookingForm}
function clients(){const cs=S.data.clients||[];shell(top('Клиенты',cs.length+' клиентов')+'<div class="list">'+cs.map(c=>'<div class="row"><div class="badge">'+(c.vip?'VIP':'•')+'</div><div><b>'+esc(c.name||'Без имени')+'</b><div class="meta">'+esc(c.phone)+' · брони '+(c.bookings_count||0)+' · визиты '+(c.visits_count||0)+'</div></div></div>').join('')+'</div>')}
function bookingForm(){const es=(S.data.events||[]).filter(e=>e.status==='active');if(!es.length)return alert('Нет активных мероприятий');modal.innerHTML='<div class="modal"><div class="box"><h3>Новая бронь</h3><div class="grid"><label class="full">Мероприятие<select id="be">'+es.map(e=>'<option value="'+e.id+'">'+fd(e.starts_at)+' · '+esc(e.name)+'</option>').join('')+'</select></label><label>Имя<input id="bn"></label><label>Телефон<input id="bp" value="+375"></label><label>Гостей<input id="bg" type="number" min="1" value="2"></label><label>Время<input id="bt" type="time" value="23:30"></label><label class="full">Столы<input id="bts" placeholder="например 3,4"></label><label class="full">Комментарий<textarea id="bc"></textarea></label></div><div id="ber" class="err" style="display:none"></div><div class="actions"><button class="btn" id="bx">Закрыть</button><button class="btn g" id="bs">Сохранить</button></div></div></div>';$('#bx').onclick=()=>modal.innerHTML='';$('#bs').onclick=async()=>{try{const e=es.find(x=>x.id===$('#be').value),tables=$('#bts').value.split(',').map(x=>+x.trim()).filter(Boolean);await api('admin.save_booking',{event_id:e.id,name:$('#bn').value,phone:$('#bp').value,guests:+$('#bg').value||1,arrival_at:e.business_date+'T'+$('#bt').value+':00+03:00',deposit:0,prepay:0,status:'hold',comment:$('#bc').value,tables,idempotency_key:crypto.randomUUID()});modal.innerHTML='';await reload();S.view='bookings';render()}catch(e){$('#ber').style.display='block';$('#ber').textContent=e.message}}}
async function reload(){S.data=await api('admin.bootstrap')}function render(){if(S.view==='events')events();else if(S.view==='bookings')bookings();else if(S.view==='clients')clients();else today()}(async()=>{if(!key()){app.innerHTML='<div style="padding:30px"><div class="err"><b>Нет ключа веб-администратора.</b><div class="meta" style="margin-top:7px">Откройте персональную ссылку BALI Booking.</div></div></div>';return}try{await reload();render()}catch(e){app.innerHTML='<div style="padding:30px"><div class="err"><b>Ошибка подключения</b><div class="meta" style="margin-top:7px">'+esc(e.message)+'</div></div></div>'}})();
</script></body></html>
